# The lakehouse: Iceberg tables in S3-compatible object storage (MinIO), an Iceberg JDBC
# catalog in PostgreSQL shared by pyiceberg and Trino, and Trino as the SQL engine.
#
#   docker compose up -d && make wait          the core stack
#   docker compose --profile bi up -d          plus Superset on http://localhost:8088
#
# MinIO stopped publishing community images in 2025; pgsty/minio is a community-maintained
# build of the same server. Any S3-compatible store works: set LH_S3_ENDPOINT.

name: lakehouse

x-minio-image: &minio-image pgsty/minio:RELEASE.2026-08-04T00-00-00Z

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg
      POSTGRES_DB: iceberg_catalog
    volumes:
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "iceberg", "-d", "iceberg_catalog"]
      interval: 2s
      retries: 30

  minio:
    image: *minio-image
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: lakehouse
      MINIO_ROOT_PASSWORD: lakehouse-secret
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 2s
      retries: 30

  create-bucket:
    image: *minio-image
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 lakehouse lakehouse-secret && mc mb --ignore-existing local/lakehouse"]
    restart: "no"

  trino:
    image: trinodb/trino:484
    depends_on:
      postgres: {condition: service_healthy}
      create-bucket: {condition: service_completed_successfully}
    environment:
      LH_CATALOG_JDBC_URL: jdbc:postgresql://postgres:5432/iceberg_catalog
      LH_CATALOG_USER: iceberg
      LH_CATALOG_PASSWORD: iceberg
      LH_S3_ENDPOINT: http://minio:9000
      LH_S3_ACCESS_KEY: lakehouse
      LH_S3_SECRET_KEY: lakehouse-secret
    volumes:
      - ./infra/trino/etc:/etc/trino:ro
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 5s
      retries: 60

  superset:
    profiles: ["bi"]
    build: ./infra/superset
    depends_on:
      trino: {condition: service_healthy}
    environment:
      SUPERSET_SECRET_KEY: change-me-for-anything-but-a-laptop
    ports: ["8088:8088"]
