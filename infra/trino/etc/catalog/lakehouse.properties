# Iceberg tables in object storage, with the table catalog in PostgreSQL. The same catalog is
# written by pyiceberg (ingestion) and read and written by Trino (dbt, maintenance).
connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=lakehouse
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=${ENV:LH_CATALOG_JDBC_URL}
iceberg.jdbc-catalog.connection-user=${ENV:LH_CATALOG_USER}
iceberg.jdbc-catalog.connection-password=${ENV:LH_CATALOG_PASSWORD}
iceberg.jdbc-catalog.default-warehouse-dir=s3://lakehouse/warehouse
iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD
# Allow the maintenance demo to expire snapshots and remove orphans immediately.
iceberg.expire-snapshots.min-retention=0s
iceberg.remove-orphan-files.min-retention=0s

fs.native-s3.enabled=true
s3.endpoint=${ENV:LH_S3_ENDPOINT}
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:LH_S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:LH_S3_SECRET_KEY}
