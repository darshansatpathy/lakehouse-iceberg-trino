lakehouse:
  target: dev
  outputs:
    dev:
      type: trino
      method: none
      http_scheme: http
      host: "{{ env_var('LH_TRINO_HOST', 'localhost') }}"
      port: "{{ env_var('LH_TRINO_PORT', '8080') | int }}"
      user: "{{ env_var('LH_TRINO_USER', 'lakehouse') }}"
      database: "{{ env_var('LH_TRINO_CATALOG', 'lakehouse') }}"
      schema: analytics
      threads: 4
